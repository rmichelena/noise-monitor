# Ejemplo de configuración para hardware real (copia a config.yaml y ajusta).
# config.yaml está en .gitignore: cada nodo mantiene su configuración local.
# Para el modo simulado sin balcón, ver config.simulate.yaml.example.

# Parámetros de audio
audio:
  source: device              # "device" = micrófono real, "file" = WAV (modo simulado)
  device_index: 5             # iMM-6C (verificar con sounddevice.query_devices())
  file_path: null             # Ruta al .wav cuando source=file (ej: data/test_videos/traffic_xxx_audio.wav)
  sample_rate: 44100
  block_size: 4096            # ~93ms por bloque (evita input overflow)
  calibration_offset: 0.0     # dB a sumar tras calibración

# Umbrales de disparo
triggers:
  peak_db: 85                 # Disparo instantáneo
  sustained_db: 70            # Umbral de persistencia
  sustained_duration_ms: 1500 # Tiempo mínimo sobre umbral
  correlation_db: 65         # Umbral si hay vehículo visible
  cooldown_seconds: 30       # Espaciado mínimo entre eventos guardados

# Parámetros de video (cámara USB ELP vía OpenCV)
video:
  source: 0                   # Índice del dispositivo USB (o "/dev/video0")
  resolution: [1920, 1080]
  framerate: 30
  inference_interval: 5       # Procesar 1 de cada N frames
  detection_threshold: 0.5    # Confianza mínima del modelo

# Buffer circular
buffer:
  audio_seconds: 10
  video_seconds: 10
  pre_event_seconds: 5
  post_event_seconds: 5

# Estimación de velocidad
speed:
  enabled: true
  reference_distance_m: 10.0  # Distancia física entre líneas
  line1_y_pixel: 400          # Coordenada Y de línea 1
  line2_y_pixel: 680          # Coordenada Y de línea 2

# Rutas (relativas al directorio del proyecto)
paths:
  database: data/events.db
  clips: data/clips
  reports: reports

# Dashboard web
web:
  host: 0.0.0.0
  port: 8000

# Centroid tracker para registro continuo de vehículos
tracker:
  max_distance: 200
  max_disappeared: 20     # inference frames sin ver antes de marcar como salido (~3.3s @ 6fps)
  min_track_seconds: 0.25
  min_displacement: 150

# Clasificador de audio (YAMNet)
audio_classifier:
  model_path: models/yamnet.tflite
  labels_path: models/yamnet_labels.txt
  min_score: 0.3
  category_map:
    vehicle:
      - Vehicle
      - Car
      - Truck
      - Motorcycle
      - Bus
      - Engine
      - "Accelerating, revving, vroom"
      - Tire squeal
      - "Car horn, honking"
    construction:
      - Jackhammer
      - Chainsaw
      - Power tool
      - Drill
      - Sawing
      - Hammer
    animal:
      - Dog
      - Bark
      - Cat
      - Bird
      - Rooster
    alarm:
      - Siren
      - Alarm
      - Emergency vehicle
      - Buzzer
      - Fire alarm
      - Smoke detector
    human:
      - Speech
      - Shout
      - Screaming
      - Music
      - Singing

# Modo simulado (Fase 0.5: desarrollo sin balcón)
debug:
  simulate: false             # true = video/audio de archivo, false = cámara y micrófono real
  loop_video: true           # reiniciar video al terminar (solo si source es archivo)
  audio_from_video: false    # true = leer audio de archivo .wav, false = usar micrófono

# Jerarquía de ruido para inferencia
noise_priority:
  truck: 1
  bus: 1
  motorcycle: 2
  car: 3
  bicycle: 4
  person: 5
