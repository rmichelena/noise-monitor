<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Noise Monitor{% endblock %}</title>
<style>
  :root { --bg:#101418; --panel:#171d24; --line:#26303a; --fg:#e6edf3;
          --dim:#8b98a5; --accent:#4cc2ff; --warn:#ffb020; --bad:#ff5c5c; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding:18px 24px; border-bottom:1px solid var(--line);
           display:flex; align-items:baseline; gap:16px; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; letter-spacing:.02em; }
  header .dim { color:var(--dim); font-size:13px; }
  main { max-width:1100px; margin:0 auto; padding:24px; display:grid; gap:20px; }
  section { background:var(--panel); border:1px solid var(--line);
            border-radius:10px; padding:18px; }
  h2 { font-size:13px; text-transform:uppercase; letter-spacing:.08em;
       color:var(--dim); margin:0 0 14px; font-weight:600; }
  .grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); }
  .metric .v { font-size:28px; font-weight:600; font-variant-numeric:tabular-nums; }
  .metric .l { font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.06em; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:7px 8px; border-bottom:1px solid var(--line); }
  th { color:var(--dim); font-weight:500; font-size:11px; text-transform:uppercase; letter-spacing:.06em; }
  tr:last-child td { border-bottom:none; }
  .num { font-variant-numeric:tabular-nums; }
  .pin { color: var(--accent); font-size:13px; }
  .tag { display:inline-block; padding:1px 7px; border-radius:999px; font-size:11px;
         border:1px solid var(--line); color:var(--dim); }
  .tag.vehicle { color:var(--accent); border-color:var(--accent); }
  .tag.kind-noise { color:var(--warn); border-color:var(--warn); }
  .tag.kind-traffic { color:var(--accent); border-color:var(--accent); }
  .tag.kind-both { color:var(--bad); border-color:var(--bad); }
  .a { color:var(--accent); text-decoration:none; }
  .ok { color:#5ad67d; } .bad { color:var(--bad); } .warn { color:var(--warn); }
  .spark { width:100%; height:60px; display:block; }
  .spark rect { fill: var(--accent); opacity:.55; }
  .spark g rect { opacity:.9; }
  .legend { display:flex; gap:16px; margin-top:10px; font-size:12px; color:var(--dim); }
  .legend i { display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; }
  .ruler { position:relative; height:18px; margin-top:2px; }
  .ruler span { position:absolute; transform:translateX(-50%); font-size:10px;
                color:var(--dim); white-space:nowrap; }
  .ruler span::before { content:''; position:absolute; left:50%; top:-4px;
                        width:1px; height:4px; background:var(--line); }
  footer { color:var(--dim); font-size:12px; text-align:center; padding:8px 0 28px; }
  button.play { background:none; border:0; color:var(--accent); cursor:pointer;
                font:inherit; padding:0; }
  button.btn { background:var(--accent); color:#04121c; border:0; border-radius:8px;
               padding:8px 14px; font:inherit; font-weight:600; cursor:pointer; }
  button.metric { display:block; text-align:left; font:inherit; color:var(--fg);
                  background:transparent; border:1px solid transparent;
                  border-radius:10px; padding:8px 10px; cursor:pointer; }
  button.metric:hover { border-color:var(--line); background:#1b232b; }
  button.metric.active { border-color:var(--accent); background:#10222e; }
  button.play:hover { text-decoration:underline; }
  dialog#player { border:1px solid var(--line); border-radius:12px; padding:0;
                  background:#0b0f13; color:var(--fg); max-width:min(1100px, 94vw); }
  dialog#player::backdrop { background:rgba(0,0,0,.75); }
  .dlg { position:relative; }
  .dlg video { display:block; width:100%; max-height:78vh; background:#000; border-radius:12px 12px 0 0; }
  .dlg .cap { padding:10px 14px; font-size:13px; color:var(--dim); }
  .dlg .x { position:absolute; top:8px; right:10px; background:rgba(0,0,0,.55);
            border:0; color:#fff; font-size:20px; line-height:1; padding:6px 10px;
            border-radius:8px; cursor:pointer; }
</style>
</head>
<body>
<header>
  <h1>Noise Monitor</h1>
  <span class="dim">balcón · Lima</span>
  <a class="a" href="/settings" style="font-size:13px">⚙ Ajustes</a>
  <span class="dim" style="margin-left:auto">{% block updated %}{{ now }}{% endblock %}</span>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer>Noise Monitor · datos locales</footer>
</body>
</html>
